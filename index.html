<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karlia | Exclusive Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
   <link rel="stylesheet" href="style.css">
   
   <!-- Firebase SDK -->
   <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
   
</head>
<body>

    <div class="logo-container">
        <img src="Logo.png" alt="Karila Logo" class="logo-img">
    </div>
    
    <!-- Time Lock Overlay -->
    <div class="time-lock-overlay" id="timeLockOverlay">
        <div class="time-lock-content">
            <div class="time-lock-icon">🌙</div>
            <h2>Toko Sedang Tutup</h2>
            <p class="time-lock-message">
                Mohon maaf, kami sedang tidak menerima pesanan.<br>
                Jam operasional: <strong>07:00 - 22:30 WIB</strong>
            </p>
            <div class="time-lock-countdown" id="timeLockCountdown">
                Buka kembali dalam: <span id="countdownTimer">--:--:--</span>
            </div>
            <div class="current-time" id="currentTimeDisplay"></div>
        </div>
    </div>

    <div class="refresh-indicator" id="refreshIndicator">
        <span id="refreshIcon">🔄</span>
        <span id="refreshText">Updating stock...</span>
    </div>

    <div class="stock-update-toast" id="stockUpdateToast">
        <span>📊</span>
        <span id="stockUpdateText">Stock updated!</span>
    </div>

    <div class="container">
        <header>
            <h1>Karila</h1>
            <p>Karila, Taste That Thrilla</p>
            <div class="sync-status" id="syncStatus" onclick="forceRefresh()">
                <div class="dot" id="syncDot"></div>
                <span id="syncText">Live Stock</span>
            </div>
            <div class="last-updated" id="lastUpdated"></div>
            <div class="operational-hours" id="operationalHours">
                <span class="hours-badge">🕐 Jam Operasional: 07:00 - 22:30 WIB</span>
            </div>
        </header>
        
        <div id="loadingState" class="loading">Memuat menu...</div>
        <div id="errorState" class="error-msg" style="display: none;"></div>
        <div class="menu-grid" id="menuGrid" style="display: none;"></div>
    </div>

    <div class="cart-trigger" id="cartOpen">🛒<div class="count-pill" id="cartCount">0</div></div>

    <div class="modal" id="cartModal">
        <div class="modal-body">
            <span class="close-x" id="cartClose">&times;</span>
            <h2 style="margin-bottom: 20px; font-family: 'Playfair Display'; color: var(--gold);">Your Selection</h2>
            
            <div class="validation-banner" id="validationBanner">
                <span style="font-size: 1.2rem;">⚠️</span>
                <span id="validationText"></span>
            </div>
            
            <div id="cartItemsList"></div>

            <div class="name-field">
                <label>Atas Nama:</label>
                <input type="text" id="customerName" placeholder="Contoh: Budi Santoso (nama yang tidak asli tidak akan diproses)" required>
            </div>

            <div class="total-box" id="cartTotal"></div>
            <button class="wa-btn" id="waSend">Konfirmasi Pesanan via WhatsApp</button>
        </div>
    </div>

    <div id="notify" class="notify"></div>

    <script>
        // ============================================
        // FIREBASE CONFIG - PUNYA KAMU
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCm9z470vzpk4CfW50T1RQjYeTY3pImwZ4",
            authDomain: "karila-order-notification.firebaseapp.com",
            databaseURL: "https://karila-order-notification-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "karila-order-notification",
            storageBucket: "karila-order-notification.firebasestorage.app",
            messagingSenderId: "68488198197",
            appId: "1:68488198197:web:b5986fafd41a2c9666197c"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // ============================================
        // CONFIG: GOOGLE SHEET URL
        // ============================================
        const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzWrShK8tKGNxDTlnUy4MKpcwzKsyaFAHVfjZ5nhVhyLH7YriGUghdvVQdsMxT9qOjr/exec';
        
        const MY_PHONE = "6282311981783"; 
        const CART_STORAGE_KEY = 'karlia_cart_v2';
        const REFRESH_INTERVAL = 5000;
        
        // Time Lock Configuration (WIB/UTC+7)
        const OPEN_HOUR = 7;    // 07:00 AM
        const OPEN_MINUTE = 0;
        const CLOSE_HOUR = 22;  // 22:30 (10:30 PM)
        const CLOSE_MINUTE = 30;
        
        let menuItems = [], quantities = {}, currencySymbol = "Rp", lastFetchTime = null;
        let cart = [];
        let isCartOpen = false;
        let stockValidationResults = { valid: true, issues: [] };
        let previousStockData = {};
        let isFirstLoad = true;
        let timeCheckInterval = null;
        let myOrderIds = new Set(); // Track order sendiri biar ga notif

        // ============================================
        // FIREBASE: Listen Order Baru (Global Notif)
        // ============================================
        function initFirebaseListener() {
            db.ref('orders').on('child_added', (snapshot) => {
                const order = snapshot.val();
                const orderId = snapshot.key;
                
                // Skip kalau ini order sendiri
                if (myOrderIds.has(orderId)) return;
                
                // Skip kalau order lebih dari 10 detik yang lalu (pas pertama load)
                if (Date.now() - order.timestamp > 10000) return;
                
                showGlobalNotification(order);
            });
        }

        function showGlobalNotification(order) {
            const notif = document.createElement('div');
            notif.className = 'global-notif';
            notif.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 5px; font-size: 1rem;">
                    🎉 Order Baru Masuk!
                </div>
                <div style="font-size: 0.9rem; margin-bottom: 3px;">
                    <strong>${order.customer}</strong> baru order
                </div>
                <div style="font-size: 0.85rem; color: #333;">
                    ${order.items ? order.items.length : 1} item • Rp ${order.total ? order.total.toLocaleString('id-ID') : '-'}
                </div>
                <div style="font-size: 0.7rem; margin-top: 8px; opacity: 0.7;">
                    ${new Date(order.timestamp).toLocaleTimeString('id-ID')}
                </div>
            `;
            
            document.body.appendChild(notif);
            
            // Suara notif (optional)
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3');
            audio.volume = 0.3;
            audio.play().catch(e => console.log('Audio blocked'));
            
            // Hilang setelah 6 detik
            setTimeout(() => {
                notif.style.animation = 'slideOut 0.5s ease';
                setTimeout(() => notif.remove(), 500);
            }, 6000);
        }

        function saveOrderToFirebase(orderData) {
            const newOrderRef = db.ref('orders').push();
            const orderId = newOrderRef.key;
            
            // Track order sendiri biar ga notif ke diri sendiri
            myOrderIds.add(orderId);
            
            newOrderRef.set({
                ...orderData,
                timestamp: Date.now(),
                status: 'new'
            });
            
            // Hapus dari tracking setelah 10 detik
            setTimeout(() => myOrderIds.delete(orderId), 10000);
        }

        // ============================================
        // TIME LOCK FUNCTIONS
        // ============================================
        
        function getCurrentWIBTime() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const wibTime = new Date(utc + (3600000 * 7));
            return wibTime;
        }
        
        function isStoreOpen() {
            const wibTime = getCurrentWIBTime();
            const currentHour = wibTime.getHours();
            const currentMinute = wibTime.getMinutes();
            const currentTime = currentHour * 60 + currentMinute;
            const openTime = OPEN_HOUR * 60 + OPEN_MINUTE;
            const closeTime = CLOSE_HOUR * 60 + CLOSE_MINUTE;
            
            return currentTime >= openTime && currentTime < closeTime;
        }
        
        function getTimeUntilOpen() {
            const wibTime = getCurrentWIBTime();
            const currentHour = wibTime.getHours();
            const currentMinute = wibTime.getMinutes();
            const currentSecond = wibTime.getSeconds();
            const currentTime = currentHour * 60 + currentMinute;
            const openTime = OPEN_HOUR * 60 + OPEN_MINUTE;
            const closeTime = CLOSE_HOUR * 60 + CLOSE_MINUTE;
            
            let targetHour, targetMinute;
            
            if (currentTime >= closeTime) {
                targetHour = OPEN_HOUR;
                targetMinute = OPEN_MINUTE;
            } else if (currentTime < openTime) {
                targetHour = OPEN_HOUR;
                targetMinute = OPEN_MINUTE;
            } else {
                return null;
            }
            
            let remainingSeconds = ((targetHour - currentHour) * 3600) + 
                                   ((targetMinute - currentMinute) * 60) - 
                                   currentSecond;
            
            if (remainingSeconds < 0) {
                remainingSeconds += 24 * 3600;
            }
            
            const hours = Math.floor(remainingSeconds / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;
            
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        function updateTimeLockDisplay() {
            const overlay = document.getElementById('timeLockOverlay');
            const countdownEl = document.getElementById('countdownTimer');
            const currentTimeEl = document.getElementById('currentTimeDisplay');
            const container = document.querySelector('.container');
            const cartTrigger = document.getElementById('cartOpen');
            
            const wibTime = getCurrentWIBTime();
            const timeString = wibTime.toLocaleTimeString('id-ID', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit',
                timeZoneName: 'short'
            });
            
            currentTimeEl.textContent = `Waktu sekarang: ${timeString} (WIB)`;
            
            if (!isStoreOpen()) {
                overlay.classList.add('active');
                container.classList.add('locked');
                cartTrigger.style.display = 'none';
                
                const countdown = getTimeUntilOpen();
                if (countdown) {
                    countdownEl.textContent = countdown;
                }
                return false;
            } else {
                overlay.classList.remove('active');
                container.classList.remove('locked');
                cartTrigger.style.display = 'flex';
                return true;
            }
        }
        
        function startTimeLockCheck() {
            updateTimeLockDisplay();
            timeCheckInterval = setInterval(() => {
                const wasOpen = !document.getElementById('timeLockOverlay').classList.contains('active');
                const isOpen = updateTimeLockDisplay();
                
                if (wasOpen && !isOpen) {
                    flashNotify("⚠️ Toko sudah tutup! Sampai jumpa besok.");
                    if (isCartOpen) {
                        document.getElementById('cartModal').classList.remove('open');
                        isCartOpen = false;
                    }
                }
            }, 1000);
        }

        // ============================================
        // GOOGLE SHEET FUNCTIONS
        // ============================================
        
        async function loadMenu(force = false) {
            if (!isStoreOpen() && !force) {
                return;
            }
            
            const syncDot = document.getElementById('syncDot');
            const syncText = document.getElementById('syncText');
            const refreshIndicator = document.getElementById('refreshIndicator');
            const refreshText = document.getElementById('refreshText');
            
            if (!force) {
                syncDot.className = 'dot syncing';
                syncText.textContent = 'Syncing...';
                refreshIndicator.classList.add('show', 'syncing');
                refreshText.textContent = 'Checking stock...';
            }
            
            try {
                const url = GOOGLE_SHEET_URL + '?t=' + Date.now() + '&r=' + Math.random();
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                    },
                    cache: 'no-store',
                    mode: 'cors'
                });
                
                if (!response.ok) throw new Error('Failed to fetch: ' + response.status);
                
                const data = await response.json();
                
                if (data.error) throw new Error('Server error: ' + data.error);
                if (!Array.isArray(data)) throw new Error('Invalid data format');
                
                const stockChanges = detectStockChanges(data);
                
                const oldMenuItems = [...menuItems];
                menuItems = data.filter(item => item.id);
                currencySymbol = "Rp";
                
                menuItems.forEach(item => {
                    if (!quantities[item.id]) quantities[item.id] = 1;
                });
                
                lastFetchTime = new Date();
                updateLastUpdated();
                
                if (stockChanges.length > 0 && !isFirstLoad) {
                    showStockUpdateToast(stockChanges);
                }
                isFirstLoad = false;
                
                if (isCartOpen && oldMenuItems.length > 0) {
                    validateCartStock(true);
                }
                
                renderUI();
                
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'none';
                document.getElementById('menuGrid').style.display = 'grid';
                
                syncDot.className = 'dot success';
                setTimeout(() => {
                    syncDot.className = 'dot';
                }, 2000);
                
            } catch (error) {
                console.error('Error loading menu:', error);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorState').innerHTML = `
                    <strong>Gagal memuat menu</strong><br>
                    ${error.message}<br><br>
                    <small>Pastikan URL Web App sudah benar dan deployment masih aktif</small>
                `;
                syncDot.className = 'dot error';
                syncText.textContent = 'Error';
            } finally {
                syncDot.classList.remove('syncing');
                syncText.textContent = 'Live Stock';
                refreshIndicator.classList.remove('show', 'syncing');
            }
        }

        function detectStockChanges(newData) {
            const changes = [];
            
            newData.forEach(newItem => {
                const oldItem = previousStockData[newItem.id];
                if (oldItem && oldItem.stock !== newItem.stock) {
                    changes.push({
                        name: newItem.name,
                        oldStock: oldItem.stock,
                        newStock: newItem.stock
                    });
                }
                previousStockData[newItem.id] = { stock: newItem.stock, name: newItem.name };
            });
            
            return changes;
        }

        function showStockUpdateToast(changes) {
            const toast = document.getElementById('stockUpdateToast');
            const text = document.getElementById('stockUpdateText');
            
            if (changes.length === 1) {
                const change = changes[0];
                const diff = change.newStock - change.oldStock;
                const action = diff > 0 ? 'restocked' : 'sold out';
                text.textContent = `${change.name}: ${change.oldStock} → ${change.newStock} ${action}`;
            } else {
                text.textContent = `${changes.length} items updated!`;
            }
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function updateLastUpdated() {
            if (lastFetchTime) {
                const timeStr = lastFetchTime.toLocaleTimeString('id-ID', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit'
                });
                document.getElementById('lastUpdated').textContent = `Terakhir update: ${timeStr}`;
            }
        }

        function forceRefresh() {
            if (!isStoreOpen()) {
                flashNotify("Toko sedang tutup. Tidak dapat refresh.");
                return;
            }
            loadMenu(true);
            flashNotify('Refreshing stock...');
        }

        setInterval(() => {
            if (isStoreOpen()) {
                loadMenu(false);
            }
        }, REFRESH_INTERVAL);

        function validateCartStock(silent = false) {
            stockValidationResults = { valid: true, issues: [] };
            let hasChanges = false;
            
            cart.forEach(cartItem => {
                const currentItem = menuItems.find(m => m.id === cartItem.id);
                
                if (!currentItem) {
                    stockValidationResults.issues.push({
                        type: 'removed',
                        item: cartItem,
                        message: `${cartItem.name} sudah tidak tersedia`
                    });
                    stockValidationResults.valid = false;
                    hasChanges = true;
                } else if (currentItem.stock <= 0) {
                    stockValidationResults.issues.push({
                        type: 'outofstock',
                        item: cartItem,
                        currentStock: 0,
                        message: `${cartItem.name} habis (stok: 0)`
                    });
                    stockValidationResults.valid = false;
                    hasChanges = true;
                } else if (cartItem.quantity > currentItem.stock) {
                    stockValidationResults.issues.push({
                        type: 'exceeds',
                        item: cartItem,
                        requested: cartItem.quantity,
                        currentStock: currentItem.stock,
                        message: `${cartItem.name} melebihi stok (minta: ${cartItem.quantity}, tersedia: ${currentItem.stock})`
                    });
                    cartItem.quantity = currentItem.stock;
                    stockValidationResults.valid = false;
                    hasChanges = true;
                }
            });
            
            if (hasChanges && !silent) {
                saveCartToStorage();
                updateCartCounter();
                renderCartModal();
                showValidationBanner();
            }
            
            return stockValidationResults.valid;
        }

        function showValidationBanner() {
            const banner = document.getElementById('validationBanner');
            const text = document.getElementById('validationText');
            
            if (stockValidationResults.issues.length === 0) return;
            
            const critical = stockValidationResults.issues.filter(i => i.type === 'removed' || i.type === 'outofstock');
            const adjusted = stockValidationResults.issues.filter(i => i.type === 'exceeds');
            
            if (critical.length > 0) {
                banner.className = 'validation-banner show';
                text.innerHTML = `<strong>${critical.length} item tidak tersedia</strong> dan telah dihapus dari keranjang. Stok habis saat Anda memesan.`;
                const invalidIds = critical.map(i => i.item.id);
                cart = cart.filter(c => !invalidIds.includes(c.id));
                saveCartToStorage();
                updateCartCounter();
            } else if (adjusted.length > 0) {
                banner.className = 'validation-banner warning show';
                text.innerHTML = `<strong>Stok berubah!</strong> ${adjusted.length} item quantity disesuaikan dengan ketersediaan terbaru.`;
            }
            
            setTimeout(() => {
                banner.classList.remove('show');
            }, 5000);
        }

        function renderUI() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            
            menuItems.forEach(item => {
                const finalPrice = item.discount > 0 ? item.price * (1 - item.discount/100) : item.price;
                const isOut = item.stock <= 0;
                const isLow = item.stock > 0 && item.stock <= 5;
                
                const prevItem = previousStockData[item.id];
                const justChanged = prevItem && prevItem.stock !== item.stock;
                
                const inCart = cart.find(c => c.id === item.id);
                
                const storeOpen = isStoreOpen();
                
                grid.innerHTML += `
                    <div class="menu-item ${isOut ? 'out-of-stock' : ''} ${justChanged ? 'stock-updated' : ''} ${!storeOpen ? 'store-closed' : ''}">
                        <div class="item-image">
                            <img src="${item.image || 'https://placehold.co/400x300/333/d4af37?text=' + encodeURIComponent(item.name)}" 
                                 onerror="this.src='https://placehold.co/400x300/333/d4af37?text=' + encodeURIComponent(item.name)">
                            ${item.discount > 0 ? `<div class="discount-badge">-${item.discount}%</div>` : ''}
                            <div class="stock-badge ${isLow ? 'low' : ''} ${justChanged ? 'changed' : ''}">
                                ${isOut ? 'Sold Out' : `Stok: ${item.stock}${isLow ? ' ⚠️' : ''}${justChanged ? ' ✨' : ''}`}
                            </div>
                            ${!storeOpen ? '<div class="closed-overlay">TUTUP</div>' : ''}
                        </div>
                        <div class="item-content">
                            <div class="item-name">${item.name}</div>
                            <p class="item-desc">${item.description || ''}</p>
                            <div class="price-row">
                                <span class="now-price">${currencySymbol}${finalPrice.toLocaleString('id-ID')}</span>
                                ${item.discount > 0 ? `<span style="text-decoration: line-through; color: #888; font-size: 0.9rem;">${currencySymbol}${item.price.toLocaleString('id-ID')}</span>` : ''}
                            </div>
                            <div class="qty-box">
                                <button class="qty-btn" onclick="changeQty(${item.id}, -1)" ${isOut || !storeOpen ? 'disabled' : ''}>−</button>
                                <span id="qty-val-${item.id}" style="font-weight:bold">${quantities[item.id]}</span>
                                <button class="qty-btn" onclick="changeQty(${item.id}, 1)" ${isOut || !storeOpen ? 'disabled' : ''}>+</button>
                            </div>
                            <button class="buy-btn" onclick="addToCart(${item.id})" ${isOut || !storeOpen ? 'disabled' : ''}>
                                ${!storeOpen ? 'Toko Tutup' : (isOut ? 'Habis' : 'Tambah Pesanan')}
                            </button>
                        </div>
                    </div>`;
            });
        }

        function changeQty(id, delta) {
            if (!isStoreOpen()) {
                flashNotify("Toko sedang tutup!");
                return;
            }
            
            const item = menuItems.find(i => i.id === id);
            if (!item) return;
            const next = quantities[id] + delta;
            if (next >= 1 && next <= item.stock) {
                quantities[id] = next;
                document.getElementById(`qty-val-${id}`).innerText = next;
            }
        }

        function addToCart(id) {
            if (!isStoreOpen()) {
                flashNotify("Maaf, toko sedang tutup!");
                return;
            }
            
            const item = menuItems.find(i => i.id === id);
            if (!item) return;
            
            if (item.stock <= 0) {
                flashNotify("Maaf, stok habis!");
                return;
            }
            
            const existing = cart.find(c => c.id === id);
            if (existing) {
                const newQty = existing.quantity + quantities[id];
                if (newQty > item.stock) {
                    flashNotify(`Stok tidak cukup! Tersedia: ${item.stock}, di keranjang: ${existing.quantity}`);
                    return;
                }
                existing.quantity = newQty;
            } else {
                cart.push({ 
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    discount: item.discount || 0,
                    image: item.image,
                    quantity: Math.min(quantities[id], item.stock)
                });
            }
            saveCartToStorage();
            updateCartCounter();
            flashNotify("Ditambahkan ke keranjang");
        }

        function updateCartCounter() {
            document.getElementById('cartCount').innerText = cart.reduce((acc, i) => acc + i.quantity, 0);
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCartToStorage();
            updateCartCounter();
            renderCartModal();
            flashNotify("Item dihapus dari keranjang");
        }

        function updateCartQuantity(id, delta) {
            if (!isStoreOpen()) {
                flashNotify("Toko sedang tutup!");
                document.getElementById('cartModal').classList.remove('open');
                isCartOpen = false;
                return;
            }
            
            const item = cart.find(c => c.id === id);
            const menuItem = menuItems.find(m => m.id === id);
            
            if (!item || !menuItem) return;
            
            const newQty = item.quantity + delta;
            
            if (newQty <= 0) {
                removeFromCart(id);
                return;
            }
            
            if (newQty > menuItem.stock) {
                flashNotify(`Stok hanya tersedia ${menuItem.stock}`);
                return;
            }
            
            item.quantity = newQty;
            saveCartToStorage();
            updateCartCounter();
            renderCartModal();
        }

        function clearCart() {
            if (cart.length === 0) return;
            if (confirm("Yakin ingin mengosongkan keranjang?")) {
                cart = [];
                saveCartToStorage();
                updateCartCounter();
                renderCartModal();
                flashNotify("Keranjang dikosongkan");
            }
        }

        function renderCartModal() {
            const list = document.getElementById('cartItemsList');
            let grandTotal = 0;
            
            if (cart.length === 0) {
                list.innerHTML = `
                    <div class="empty-cart-msg">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                        <p>Keranjang kosong.</p>
                        <p style="font-size: 0.85rem; margin-top: 10px;">Silakan pilih menu favorit Anda</p>
                    </div>`;
            } else {
                list.innerHTML = '';
                cart.forEach(item => {
                    const currentItem = menuItems.find(m => m.id === item.id);
                    const price = item.discount > 0 ? item.price * (1 - item.discount/100) : item.price;
                    const itemTotal = price * item.quantity;
                    grandTotal += itemTotal;
                    
                    let stockStatusHtml = '';
                    let itemClass = 'cart-item';
                    
                    if (!currentItem) {
                        itemClass += ' error';
                        stockStatusHtml = `<div class="stock-error">❌ Item tidak tersedia lagi</div>`;
                    } else if (currentItem.stock <= 0) {
                        itemClass += ' error';
                        stockStatusHtml = `<div class="stock-error">❌ Stok habis</div>`;
                    } else if (item.quantity > currentItem.stock) {
                        itemClass += ' warning';
                        stockStatusHtml = `<div class="stock-warning">⚠️ Stok tersisa: ${currentItem.stock}</div>`;
                    } else if (currentItem.stock <= 5) {
                        stockStatusHtml = `<div class="stock-warning">⚠️ Stok menipis: ${currentItem.stock}</div>`;
                    }
                    
                    const storeOpen = isStoreOpen();
                    
                    list.innerHTML += `
                        <div class="${itemClass}">
                            <div class="cart-item-info">
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-details">
                                    ${currencySymbol}${price.toLocaleString('id-ID')} / item
                                </div>
                                ${stockStatusHtml}
                                <div class="cart-qty-control">
                                    <button class="cart-qty-btn" onclick="updateCartQuantity(${item.id}, -1)" ${!currentItem || currentItem.stock <= 0 || !storeOpen ? 'disabled' : ''}>−</button>
                                    <span class="cart-qty-value">${item.quantity}</span>
                                    <button class="cart-qty-btn" onclick="updateCartQuantity(${item.id}, 1)" ${!currentItem || item.quantity >= currentItem.stock || !storeOpen ? 'disabled' : ''}>+</button>
                                </div>
                            </div>
                            <div class="cart-item-price">${currencySymbol}${itemTotal.toLocaleString('id-ID')}</div>
                            <button class="remove-btn" onclick="removeFromCart(${item.id})" title="Hapus item">
                                ×
                            </button>
                        </div>`;
                });
                
                list.innerHTML += `
                    <div style="text-align: center;">
                        <button class="clear-cart-btn" onclick="clearCart()">🗑️ Kosongkan Keranjang</button>
                    </div>`;
            }
            
            document.getElementById('cartTotal').innerText = `Total: ${currencySymbol}${grandTotal.toLocaleString('id-ID')}`;
            
            const waBtn = document.getElementById('waSend');
            const storeOpen = isStoreOpen();
            waBtn.disabled = cart.length === 0 || !stockValidationResults.valid || !storeOpen;
            
            if (!storeOpen) {
                waBtn.textContent = "Toko Tutup - Buka 07:00 WIB";
            } else {
                waBtn.textContent = "Konfirmasi Pesanan via WhatsApp";
            }
        }

        function sendToWA() {
            if (!isStoreOpen()) {
                flashNotify("Toko sedang tutup! Tidak dapat memesan.");
                return;
            }
            
            const isValid = validateCartStock();
            if (!isValid) {
                flashNotify("Periksa keranjang - ada perubahan stok!");
                return;
            }
            
            const name = document.getElementById('customerName').value.trim();
            if (!name) return alert("Harap isi 'Atas Nama' terlebih dahulu!");
            if (cart.length === 0) return alert("Keranjang masih kosong!");

            let msg = `*PESANAN BARU - KARILA* \n--------------------------\n*Atas Nama:* ${name}\n--------------------------\n`;
            let total = 0;
            const items = [];
            
            cart.forEach(item => {
                const p = item.discount > 0 ? item.price * (1 - item.discount/100) : item.price;
                total += p * item.quantity;
                items.push({ name: item.name, qty: item.quantity, price: p });
                msg += `• *${item.name}* (x${item.quantity})\n`;
            });
            
            msg += `\n--------------------------\n*TOTAL: ${currencySymbol}${total.toLocaleString('id-ID')}*`;
            
            // Simpan ke Firebase (trigger notif global)
            const orderData = {
                customer: name,
                items: items,
                total: total,
                timestamp: Date.now(),
                phone: MY_PHONE
            };
            saveOrderToFirebase(orderData);
            
            cart = [];
            saveCartToStorage();
            updateCartCounter();
            
            window.open(`https://wa.me/${MY_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
            document.getElementById('cartModal').classList.remove('open');
            document.getElementById('validationBanner').classList.remove('show');
        }

        function flashNotify(m) {
            const n = document.getElementById('notify');
            n.innerText = m; 
            n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 2000);
        }

        function loadCartFromStorage() {
            try {
                const savedCart = localStorage.getItem(CART_STORAGE_KEY);
                if (savedCart) {
                    cart = JSON.parse(savedCart);
                    updateCartCounter();
                }
            } catch (e) {
                console.error('Error loading cart:', e);
                cart = [];
            }
        }

        function saveCartToStorage() {
            try {
                localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
            } catch (e) {
                console.error('Error saving cart:', e);
            }
        }

        // Event listeners
        document.getElementById('cartOpen').onclick = () => { 
            if (!isStoreOpen()) {
                flashNotify("Toko sedang tutup!");
                return;
            }
            isCartOpen = true;
            validateCartStock();
            document.getElementById('cartModal').classList.add('open'); 
            renderCartModal(); 
        };
        
        document.getElementById('cartClose').onclick = () => {
            isCartOpen = false;
            document.getElementById('cartModal').classList.remove('open');
            document.getElementById('validationBanner').classList.remove('show');
        };
        
        document.getElementById('waSend').onclick = sendToWA;

        document.getElementById('cartModal').onclick = (e) => {
            if (e.target.id === 'cartModal') {
                isCartOpen = false;
                document.getElementById('cartModal').classList.remove('open');
                document.getElementById('validationBanner').classList.remove('show');
            }
        };

        // Initialize
        loadCartFromStorage();
        startTimeLockCheck();
        initFirebaseListener(); // Start listening for orders
        
        if (isStoreOpen()) {
            loadMenu();
        }
    </script>
</body>
</html>
